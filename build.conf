# Docker image options for code-audit-agent.
#
# The default image already scans Python, JavaScript/TypeScript, Java, Go and HTML statically
# (opengrep rules, bandit, gitleaks, osv-scanner) and can run Python apps in the sandbox.
# Uncomment an option to add more; the next `.\caa.ps1 ...` / `./caa.sh ...` rebuilds the image.
#
# WITH_GO=1      # gosec + govulncheck + Go toolchain: deeper Go checks, run Go apps (+3-5 min build)
# WITH_NODE=1    # Node.js + npm: run JS/TS apps in the sandbox with --run-app      (+1 min build)
# WITH_BROWSER=1 # Playwright + Chromium: `caa live` drives a real browser (crawl, DOM-XSS, CSRF) (+~400 MB)
