# Cards for classes reported by multi-language analyzers and hygiene checks.
# ASVS references are to ASVS 4.0.3; OWASP to Top 10 2021.
- cwe: CWE-94
  title: "Code injection (eval of untrusted input)"
  owasp: "A03:2021 Injection"
  asvs: "V5.2.4"
  severity: high
  impact: "Attacker-controlled text is executed as code (eval, Function(), exec, vm.runInContext)."
  sources: ['request parameters', 'message payloads']
  sinks: ['eval', 'exec', 'new Function', 'vm.runInNewContext', 'setTimeout(string)']
  sanitizers: ['no eval: parse data with json/ast.literal_eval', 'strict allow-list of operations']
  not_sanitizers: ['regex blacklist of keywords']
  fix: "Never evaluate input; parse it as data (JSON) or map it to an allow-list of operations."
  property: "Marker reaching eval proves the flow."
- cwe: CWE-601
  title: "Open redirect"
  owasp: "A01:2021 Broken Access Control"
  asvs: "V5.1.5"
  severity: medium
  impact: "Users are redirected to an attacker site from a trusted domain (phishing, token theft)."
  sources: ['next / redirect / url parameter']
  sinks: ['redirect()', 'res.redirect', 'http.Redirect', 'sendRedirect']
  sanitizers: ['relative-path only', 'host allow-list after parsing']
  not_sanitizers: ['startswith("/") alone (//evil.com)']
  fix: "Accept only relative paths or allow-listed hosts."
  property: "Redirect target stays on own host."
- cwe: CWE-611
  title: "XML external entity (XXE)"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V5.5.2"
  severity: high
  impact: "XML parser resolves external entities: file read, SSRF."
  sources: ['uploaded or posted XML']
  sinks: ['DocumentBuilderFactory', 'SAXParser', 'lxml with resolve_entities', 'xml.etree on untrusted input']
  sanitizers: ['disallow-doctype-decl feature', 'defusedxml']
  not_sanitizers: ['schema validation']
  fix: "Disable DTDs/external entities (Java features) or use defusedxml (Python)."
  property: "Parser configuration inspection."
- cwe: CWE-502
  title: "Deserialization of untrusted data"
  owasp: "A08:2021 Software and Data Integrity Failures"
  asvs: "V5.5.3"
  severity: high
  impact: "pickle/ObjectInputStream/yaml.load on attacker data executes code."
  sources: ['request body', 'cookies', 'files from users']
  sinks: ['pickle.loads', 'yaml.load (unsafe Loader)', 'ObjectInputStream.readObject', 'node-serialize']
  sanitizers: ['json', 'yaml.safe_load', 'look-ahead class allow-list']
  not_sanitizers: ['signature checks with leaked keys']
  fix: "Use a data-only format (JSON) or a safe loader."
  property: "Sink inspection."
- cwe: CWE-295
  title: "TLS certificate verification disabled"
  owasp: "A02:2021 Cryptographic Failures"
  asvs: "V9.2.1"
  severity: medium
  impact: "Man-in-the-middle can read and alter traffic."
  sources: ['n/a']
  sinks: ['verify=False', 'InsecureSkipVerify: true', 'rejectUnauthorized: false', 'TrustAllCerts']
  sanitizers: ['only in tests against local fixtures']
  not_sanitizers: []
  fix: "Keep verification on; add the internal CA to the trust store instead."
  property: "Line inspection."
- cwe: CWE-338
  title: "Weak random number generator for security values"
  owasp: "A02:2021 Cryptographic Failures"
  asvs: "V6.3.1"
  severity: medium
  impact: "Tokens/passwords generated with math/rand or random are predictable."
  sources: ['n/a']
  sinks: ['math/rand', 'random.random', 'Math.random']
  sanitizers: ['non-security use (shuffling UI, jitter)']
  not_sanitizers: ['seeding with time']
  fix: "Use crypto/rand, secrets, crypto.randomBytes, SecureRandom."
  property: "Purpose of the value decides."
- cwe: CWE-326
  title: "Inadequate encryption strength"
  owasp: "A02:2021 Cryptographic Failures"
  asvs: "V6.2.1"
  severity: medium
  impact: "Short RSA keys or weak ciphers can be broken."
  sources: ['n/a']
  sinks: ['rsa.GenerateKey(< 2048)', 'DES', 'RC4']
  sanitizers: []
  not_sanitizers: []
  fix: "RSA >= 3072 / ECDSA P-256+, AES-GCM."
  property: "Line inspection."
- cwe: CWE-1336
  title: "Server-side template injection"
  owasp: "A03:2021 Injection"
  asvs: "V5.2.5"
  severity: high
  impact: "User input becomes template source: code execution in the template engine."
  sources: ['request parameters']
  sinks: ['render_template_string', 'Template(input)', 'ejs.render(input)']
  sanitizers: ['constant template with variables passed as context']
  not_sanitizers: ['escaping HTML']
  fix: "Keep template text constant; pass user values as variables."
  property: "Marker reaching template source."
- cwe: CWE-400
  title: "Uncontrolled resource consumption"
  owasp: "A04:2021 Insecure Design"
  asvs: "V12.1.1"
  severity: low
  impact: "Unbounded reads/decompression or missing timeouts let a client exhaust memory or connections."
  sources: ['request body', 'archives']
  sinks: ['io.Copy without limit', 'http.Server without timeouts', 'zip bombs']
  sanitizers: ['size limits', 'timeouts']
  not_sanitizers: []
  fix: "Add limits (MaxBytesReader, LimitReader) and server timeouts."
  property: "Configuration inspection."
- cwe: CWE-540
  title: "Sensitive file can end up in the repository"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V14.3.3"
  severity: high
  impact: ".env files, private keys or credential JSON are committed (or will be) and leak through git history, forks and CI logs."
  sources: ['.env', '*.pem', 'credentials.json']
  sinks: ['git history', 'container image']
  sanitizers: ['listed in .gitignore / .dockerignore', 'placeholder-only example files (.env.example)']
  not_sanitizers: ['deleting the file in a later commit (history keeps it)']
  fix: "Add the pattern to .gitignore/.dockerignore; if already committed, rotate the secrets and purge history."
  property: "git check-ignore / git ls-files."
- cwe: CWE-250
  title: "Container runs as root"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V14.2.6"
  severity: medium
  impact: "A compromise of the app gives root inside the container and eases container escape."
  sources: ['Dockerfile']
  sinks: ['final stage without USER']
  sanitizers: ['USER <non-root> in the final stage', 'runAsNonRoot in the orchestrator']
  not_sanitizers: []
  fix: "Create an unprivileged user and switch to it with USER."
  property: "Dockerfile inspection."
- cwe: CWE-1357
  title: "Unpinned dependency or base image"
  owasp: "A06:2021 Vulnerable and Outdated Components"
  asvs: "V14.2.4"
  severity: low
  impact: "Builds silently pick up new (possibly vulnerable or hijacked) versions."
  sources: ['requirements without ==', 'package.json without lockfile', 'FROM image:latest']
  sinks: ['build']
  sanitizers: ['lockfile', 'exact pins / digests']
  not_sanitizers: ['>= ranges']
  fix: "Pin exact versions and commit the lockfile; pin images by tag or digest."
  property: "Manifest inspection."
- cwe: CWE-829
  title: "Untrusted code in the build or CI pipeline"
  owasp: "A08:2021 Software and Data Integrity Failures"
  asvs: "V10.3.2"
  severity: high
  impact: "CI runs code an outsider controls with repository secrets (pull_request_target + PR checkout, actions on moving branches, ADD from URLs)."
  sources: ['pull request content', 'third-party actions']
  sinks: ['CI job with secrets', 'image build']
  sanitizers: ['pull_request trigger without secrets', 'actions pinned by commit SHA', 'checksum-verified downloads']
  not_sanitizers: ['pinning to a tag of a third party you do not control']
  fix: "Do not check out PR code in pull_request_target jobs; pin actions to SHAs; verify downloads."
  property: "Workflow inspection."
- cwe: CWE-1188
  title: "Insecure default configuration"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V14.1.3"
  severity: low
  impact: "Defaults like ALLOWED_HOSTS=['*'] enable host-header attacks and cache poisoning."
  sources: ['settings']
  sinks: ['deployment']
  sanitizers: ['explicit host list from environment']
  not_sanitizers: []
  fix: "List real host names; load them from the environment."
  property: "Settings inspection."
- cwe: CWE-614
  title: "Cookie without Secure flag"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V3.4.1"
  severity: low
  impact: "Session or CSRF cookie may travel over plain HTTP."
  sources: ['settings']
  sinks: ['Set-Cookie']
  sanitizers: ['HTTPS-only deployment with Secure cookies']
  not_sanitizers: []
  fix: "Set *_COOKIE_SECURE = True in production settings."
  property: "Settings inspection."
- cwe: CWE-200
  title: "Information exposure"
  owasp: "A01:2021 Broken Access Control"
  asvs: "V7.4.1"
  severity: low
  impact: "Debug endpoints (pprof) or verbose errors reveal internals."
  sources: ['n/a']
  sinks: ['net/http/pprof import', 'stack traces in responses']
  sanitizers: ['debug endpoints bound to localhost / behind auth']
  not_sanitizers: []
  fix: "Remove or protect debug endpoints."
  property: "Line inspection."
- cwe: CWE-353
  title: "Missing integrity check for third-party script"
  owasp: "A08:2021 Software and Data Integrity Failures"
  asvs: "V14.2.3"
  severity: low
  impact: "If the CDN is compromised, the script runs with full access to the page."
  sources: ['<script src> / <link href> on another origin']
  sinks: ['browser']
  sanitizers: ['integrity="sha384-..." with crossorigin', 'self-hosted copy']
  not_sanitizers: ['pinning the version in the URL']
  fix: "Add integrity and crossorigin attributes (or self-host the file)."
  property: "Tag inspection."
- cwe: CWE-1022
  title: "Link to untrusted target with window.opener access"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V14.5.2"
  severity: low
  impact: "The opened page can navigate the original tab (reverse tabnabbing) in older browsers."
  sources: ['<a target=_blank>']
  sinks: ['browser']
  sanitizers: ['rel="noopener noreferrer"']
  not_sanitizers: []
  fix: "Add rel=\"noopener noreferrer\"."
  property: "Tag inspection."
- cwe: CWE-319
  title: "Cleartext transmission"
  owasp: "A02:2021 Cryptographic Failures"
  asvs: "V9.1.1"
  severity: medium
  impact: "Resources fetched over HTTP can be read or replaced on the network."
  sources: ['http:// URLs']
  sinks: ['browser', 'HTTP client']
  sanitizers: ['https']
  not_sanitizers: []
  fix: "Use https URLs."
  property: "Tag inspection."
- cwe: CWE-352
  title: "Cross-site request forgery"
  owasp: "A01:2021 Broken Access Control"
  asvs: "V4.2.2"
  severity: medium
  impact: "Another site can make a logged-in user's browser submit this form."
  sources: ['state-changing POST form']
  sinks: ['server action']
  sanitizers: ['{% csrf_token %} / framework CSRF middleware', 'SameSite=Strict cookies']
  not_sanitizers: ['checking Referer only']
  fix: "Add the framework's CSRF token to the form."
  property: "Template inspection."
- cwe: CWE-209
  title: "Error message with sensitive details"
  owasp: "A05:2021 Security Misconfiguration"
  asvs: "V7.4.1"
  severity: medium
  impact: "Stack traces, debug pages or SQL errors reveal code paths, versions and queries to any client."
  sources: ['malformed input']
  sinks: ['HTTP error response']
  sanitizers: ['generic error page in production', 'DEBUG off']
  not_sanitizers: []
  fix: "Turn debug off in production and return generic errors; log details server-side."
  property: "Runtime probe on the running app."
