# Ground truth for the seeded stand. Kept OUTSIDE repo/ so the agent never sees it.
# A finding matches a label when the file is equal, the CWE is in the same
# equivalence class (see eval/metrics.py) and the finding's line lies inside
# `function` (or on the line containing `anchor`).
# `cwe_alt`: other CWE ids that describe the same flaw (applied identically to every row).
# Access control also accepts CWE-306 (see eval/metrics.py EQUIV).
# Every file in repo/ that has no label is a fixed twin or a trap: any open
# finding there is a false positive.
