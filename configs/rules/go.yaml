    - pattern-either:
      - pattern: $C.QueryParam(...)
      - pattern: $C.Param(...)
      - pattern: $C.FormValue(...)
  pattern-sanitizers:
  - pattern: strconv.Atoi(...)
  - pattern: strconv.ParseInt(...)
  - pattern: strconv.ParseUint(...)
  - pattern: uuid.Parse(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: exec.Command("sh", "-c", $C, ...)
      - pattern: exec.Command("bash", "-c", $C, ...)
      - pattern: exec.CommandContext($CTX, "sh", "-c", $C, ...)
      - pattern: exec.Command($C, ...)
    - focus-metavariable: $C
- id: caa.go.path.taint
  languages:
  - go
  severity: WARNING
  message: Request data is used as a file path.
  metadata:
    cwe: CWE-22
    group: A
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($W http.ResponseWriter, $R *http.Request) { ... }
      - pattern-inside: func($W http.ResponseWriter, $R *http.Request) { ... }
    - pattern-either:
      - pattern: $R.URL.Query()
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: $R.PathValue(...)
      - pattern: $R.Body
      - pattern: mux.Vars($R)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C *gin.Context) { ... }
      - pattern-inside: func($C *gin.Context) { ... }
    - pattern-either:
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.PostForm(...)
      - pattern: $C.DefaultQuery(...)
      - pattern: $C.GetHeader(...)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C echo.Context) error { ... }
      - pattern-inside: func($C echo.Context) error { ... }
    - pattern-either:
      - pattern: $C.QueryParam(...)
      - pattern: $C.Param(...)
      - pattern: $C.FormValue(...)
  pattern-sanitizers:
  - pattern: filepath.Base(...)
  - pattern: path.Base(...)
  - pattern: strconv.Atoi(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: os.Open($P)
      - pattern: os.OpenFile($P, ...)
      - pattern: os.ReadFile($P)
      - pattern: ioutil.ReadFile($P)
      - pattern: os.Remove($P)
      - pattern: http.ServeFile($W2, $R2, $P)
    - focus-metavariable: $P
- id: caa.go.xss.taint
  languages:
  - go
  severity: WARNING
  message: Request data is written into an HTML response without escaping.
  metadata:
    cwe: CWE-79
    group: A
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($W http.ResponseWriter, $R *http.Request) { ... }
      - pattern-inside: func($W http.ResponseWriter, $R *http.Request) { ... }
    - pattern-either:
      - pattern: $R.URL.Query()
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: $R.PathValue(...)
      - pattern: $R.Body
      - pattern: mux.Vars($R)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C *gin.Context) { ... }
      - pattern-inside: func($C *gin.Context) { ... }
    - pattern-either:
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.PostForm(...)
      - pattern: $C.DefaultQuery(...)
      - pattern: $C.GetHeader(...)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C echo.Context) error { ... }
      - pattern-inside: func($C echo.Context) error { ... }
    - pattern-either:
      - pattern: $C.QueryParam(...)
      - pattern: $C.Param(...)
      - pattern: $C.FormValue(...)
  pattern-sanitizers:
  - pattern: html.EscapeString(...)
  - pattern: template.HTMLEscapeString(...)
  - pattern: url.QueryEscape(...)
  - pattern: strconv.Atoi(...)
  - pattern: json.Marshal(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: fmt.Fprintf($W2, $FMT, ..., $X, ...)
      - pattern: fmt.Fprint($W2, ..., $X, ...)
      - pattern: io.WriteString($W2, $X)
      - pattern: $W2.Write([]byte($X))
      - pattern: template.HTML($X)
    - focus-metavariable: $X
