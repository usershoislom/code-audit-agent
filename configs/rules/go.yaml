      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: $R.PathValue(...)
      - pattern: $R.Body
      - pattern: mux.Vars($R)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C *gin.Context) { ... }
      - pattern-inside: func($C *gin.Context) { ... }
    - pattern-either:
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.PostForm(...)
      - pattern: $C.DefaultQuery(...)
      - pattern: $C.GetHeader(...)
  - patterns:
    - pattern-either:
