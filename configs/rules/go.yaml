  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C *gin.Context) { ... }
      - pattern-inside: func($C *gin.Context) { ... }
    - pattern-either:
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.PostForm(...)
