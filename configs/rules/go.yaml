# Go (net/http, gin, echo, gorilla/mux). Taint mode -> traces become L2 evidence; gosec runs alongside.
# Sources are scoped to handler signatures (typed metavariables are unreliable for Go in Semgrep CE).
rules:
- id: caa.go.sqli.taint
  languages:
  - go
  severity: ERROR
  message: Request data reaches a SQL query string.
  metadata:
    cwe: CWE-89
    group: A
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($W http.ResponseWriter, $R *http.Request) { ... }
      - pattern-inside: func($W http.ResponseWriter, $R *http.Request) { ... }
    - pattern-either:
      - pattern: $R.URL.Query()
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: $R.PathValue(...)
      - pattern: $R.Body
      - pattern: mux.Vars($R)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C *gin.Context) { ... }
      - pattern-inside: func($C *gin.Context) { ... }
    - pattern-either:
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.PostForm(...)
      - pattern: $C.DefaultQuery(...)
      - pattern: $C.GetHeader(...)
  - patterns:
    - pattern-either:
      - pattern-inside: func $F($C echo.Context) error { ... }
      - pattern-inside: func($C echo.Context) error { ... }
    - pattern-either:
      - pattern: $C.QueryParam(...)
      - pattern: $C.Param(...)
      - pattern: $C.FormValue(...)
  pattern-sanitizers:
  - pattern: strconv.Atoi(...)
  - pattern: strconv.ParseInt(...)
  - pattern: strconv.ParseUint(...)
  - pattern: uuid.Parse(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $DB.Query($Q, ...)
      - pattern: $DB.QueryRow($Q, ...)
      - pattern: $DB.Exec($Q, ...)
      - pattern: $DB.QueryContext($CTX, $Q, ...)
      - pattern: $DB.QueryRowContext($CTX, $Q, ...)
      - pattern: $DB.ExecContext($CTX, $Q, ...)
      - pattern: $DB.Raw($Q, ...)
    - focus-metavariable: $Q
