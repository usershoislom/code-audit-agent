- id: caa.java.xxe.documentbuilder
  languages:
  - java
  severity: WARNING
  message: XML parser created without disabling DOCTYPE / external entities.
  metadata:
    cwe: CWE-611
    group: A
  patterns:
  - pattern: DocumentBuilderFactory.newInstance()
  - pattern-not-inside: '$F = DocumentBuilderFactory.newInstance();

      ...

      $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);

      '
  - pattern-not-inside: '$T $F = DocumentBuilderFactory.newInstance();

      ...

      $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);

      '
- id: caa.java.crypto.weak-hash
  languages:
  - java
  severity: WARNING
  message: Weak hash algorithm (MD5/SHA-1).
  metadata:
    cwe: CWE-327
    group: D
  pattern-either:
  - pattern: MessageDigest.getInstance("MD5")
  - pattern: MessageDigest.getInstance("SHA-1")
  - pattern: MessageDigest.getInstance("SHA1")
- id: caa.java.deserialization
  languages:
  - java
  severity: ERROR
  message: Java native deserialization of a stream.
  metadata:
    cwe: CWE-502
    group: A
  pattern: (ObjectInputStream $O).readObject()
- id: caa.java.secrets.hardcoded
  languages:
  - java
  severity: WARNING
  message: Credential-like value hard-coded in source.
  metadata:
    cwe: CWE-798
    group: D
  pattern-regex: (?i)\b(?:password|passwd|secret|api_?key|token)\w*\s*=\s*"[^"\s]{8,}"
