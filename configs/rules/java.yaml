# Java (Servlet / Spring MVC). Taint mode -> traces become L2 evidence.
# (YAML anchors expanded: the Semgrep parser does not support aliases)
rules:
- id: caa.java.sqli.taint
  languages:
  - java
  severity: ERROR
  message: Request data reaches a SQL query string.
  metadata:
    cwe: CWE-89
    group: A
  mode: taint
  pattern-sources:
  - pattern: (HttpServletRequest $R).getParameter(...)
  - pattern: (HttpServletRequest $R).getParameterValues(...)
  - pattern: (HttpServletRequest $R).getHeader(...)
  - pattern: (HttpServletRequest $R).getQueryString()
  - pattern: (HttpServletRequest $R).getPathInfo()
  - patterns:
    - pattern-inside: '$RET $M(..., @$A(...) $T $X, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $A
        regex: ^(RequestParam|PathVariable|RequestHeader|RequestBody|CookieValue)$
    - pattern: $X
  - patterns:
    - pattern-inside: '$RET $M(..., @$A $T $X, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $A
        regex: ^(RequestParam|PathVariable|RequestHeader|RequestBody|CookieValue)$
    - pattern: $X
  pattern-sanitizers:
  - pattern: Integer.parseInt(...)
  - pattern: Long.parseLong(...)
  - pattern: Integer.valueOf(...)
  - pattern: Long.valueOf(...)
  - pattern: UUID.fromString(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: (java.sql.Statement $S).executeQuery($Q)
      - pattern: (java.sql.Statement $S).execute($Q)
      - pattern: (java.sql.Statement $S).executeUpdate($Q)
      - pattern: (Statement $S).executeQuery($Q)
      - pattern: (Statement $S).execute($Q)
      - pattern: (Statement $S).executeUpdate($Q)
      - pattern: $CONN.prepareStatement($Q)
      - pattern: $JDBC.queryForList($Q, ...)
      - pattern: $JDBC.queryForObject($Q, ...)
      - pattern: $JDBC.query($Q, ...)
      - pattern: $JDBC.update($Q, ...)
      - pattern: $EM.createQuery($Q, ...)
      - pattern: $EM.createNativeQuery($Q, ...)
    - focus-metavariable: $Q
