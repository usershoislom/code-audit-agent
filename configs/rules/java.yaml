- id: caa.java.path.taint
  languages:
  - java
  severity: WARNING
  message: Request data is used as a file path.
  metadata:
    cwe: CWE-22
    group: A
  mode: taint
  pattern-sources:
  - pattern: (HttpServletRequest $R).getParameter(...)
  - pattern: (HttpServletRequest $R).getParameterValues(...)
  - pattern: (HttpServletRequest $R).getHeader(...)
  - pattern: (HttpServletRequest $R).getQueryString()
  - pattern: (HttpServletRequest $R).getPathInfo()
  - patterns:
    - pattern-inside: '$RET $M(..., @$A(...) $T $X, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $A
        regex: ^(RequestParam|PathVariable|RequestHeader|RequestBody|CookieValue)$
    - pattern: $X
  - patterns:
    - pattern-inside: '$RET $M(..., @$A $T $X, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $A
        regex: ^(RequestParam|PathVariable|RequestHeader|RequestBody|CookieValue)$
    - pattern: $X
  pattern-sanitizers:
  - pattern: FilenameUtils.getName(...)
  - pattern: (Path $P).getFileName()
  - pattern: Integer.parseInt(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: new File($P, ...)
      - pattern: new File($B, $P)
      - pattern: new FileInputStream($P)
      - pattern: new FileReader($P)
      - pattern: Paths.get($P, ...)
      - pattern: Path.of($P, ...)
    - focus-metavariable: $P
- id: caa.java.xss.taint
  languages:
  - java
  severity: WARNING
  message: Request data is written to the response without HTML encoding.
  metadata:
    cwe: CWE-79
    group: A
  mode: taint
  pattern-sources:
  - pattern: (HttpServletRequest $R).getParameter(...)
  - pattern: (HttpServletRequest $R).getParameterValues(...)
  - pattern: (HttpServletRequest $R).getHeader(...)
  - pattern: (HttpServletRequest $R).getQueryString()
  - pattern: (HttpServletRequest $R).getPathInfo()
  - patterns:
    - pattern-inside: '$RET $M(..., @$A(...) $T $X, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $A
        regex: ^(RequestParam|PathVariable|RequestHeader|RequestBody|CookieValue)$
    - pattern: $X
  - patterns:
    - pattern-inside: '$RET $M(..., @$A $T $X, ...) { ... }

        '
    - metavariable-regex:
        metavariable: $A
        regex: ^(RequestParam|PathVariable|RequestHeader|RequestBody|CookieValue)$
    - pattern: $X
  pattern-sanitizers:
  - pattern: Encode.forHtml(...)
  - pattern: HtmlUtils.htmlEscape(...)
  - pattern: StringEscapeUtils.escapeHtml4(...)
  - pattern: Integer.parseInt(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: (HttpServletResponse $R).getWriter().write($X)
      - pattern: (HttpServletResponse $R).getWriter().print($X)
      - pattern: (HttpServletResponse $R).getWriter().println($X)
      - pattern: (PrintWriter $W).write($X)
      - pattern: (PrintWriter $W).print($X)
      - pattern: (PrintWriter $W).println($X)
    - focus-metavariable: $X
