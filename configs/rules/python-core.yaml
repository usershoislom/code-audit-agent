# Offline Semgrep/Opengrep ruleset (snapshot shipped with the tool; no registry access needed).
# Deliberately broad: recall comes from the candidate generator, precision from triage/ladder.
rules:
  - id: caa.python.sqli.string-built-query
    languages: [python]
    severity: ERROR
    message: SQL query text built from a non-constant string is passed to execute().
    metadata: {cwe: "CWE-89", group: A}
    pattern-either:
      - pattern: $C.execute(f"...", ...)
      - pattern: $C.execute("..." + $X, ...)
      - pattern: $C.execute($X + "...", ...)
      - pattern: $C.execute("..." % $X, ...)
      - pattern: $C.execute("...".format(...), ...)
      - pattern: $C.executescript($X)
      - patterns:
          - pattern: $C.execute($Q, ...)
          - pattern-inside: |
              $Q = f"..."
              ...
      - patterns:
          - pattern: $C.execute($Q, ...)
          - pattern-inside: |
              $Q = "..." + $X
              ...
      - patterns:
          - pattern: $C.execute($Q, ...)
          - pattern-inside: |
              $Q = "..." + $X + "..."
              ...
      - pattern: $C.execute("..." + $X + "...", ...)
      - patterns:
          - pattern: $C.execute($Q, ...)
          - pattern-inside: |
              $Q = "..." % $X
              ...
      - patterns:
          - pattern: $C.execute($Q, ...)
          - pattern-inside: |
              $Q = "...".format(...)
              ...

  - id: caa.python.cmdi.shell
    languages: [python]
    severity: ERROR
    message: Command executed through a shell with a non-constant command string.
    metadata: {cwe: "CWE-78", group: A}
    pattern-either:
      - patterns:
          - pattern: subprocess.$F($CMD, ..., shell=True, ...)
          - pattern-not: subprocess.$F("...", ..., shell=True, ...)
      - patterns:
          - pattern: os.system($CMD)
          - pattern-not: os.system("...")
      - patterns:
          - pattern: os.popen($CMD, ...)
          - pattern-not: os.popen("...", ...)

  - id: caa.python.path.user-path-open
    languages: [python]
    severity: WARNING
    message: File path built from a non-constant value is opened or served.
    metadata: {cwe: "CWE-22", group: A}
    pattern-either:
      - pattern: open(os.path.join($B, $X, ...), ...)
      - pattern: open($B + $X, ...)
      - pattern: open(f"...", ...)
      - patterns:
          - pattern: open($P, ...)
          - pattern-inside: |
              $P = os.path.join($B, $X, ...)
              ...
      - patterns:
          - pattern: send_file($P, ...)
          - pattern-not: send_file("...", ...)
      - patterns:
          - pattern: flask.send_file($P, ...)
          - pattern-not: flask.send_file("...", ...)

  - id: caa.python.xss.raw-html-response
    languages: [python]
    severity: WARNING
    message: HTML built by string formatting is returned from a request handler without escaping.
    metadata: {cwe: "CWE-79", group: A}
    patterns:
      - pattern-inside: |
          @$APP.route(...)
          def $H(...):
            ...
      - pattern-either:
          - pattern: return f"...<...", ...
          - pattern: return f"..."
          - pattern: return "..." + $X
          - pattern: return "..." % $X
          - pattern: return "...".format(...)
          - pattern: make_response(f"...", ...)
          - pattern: make_response("..." + $X, ...)
          - pattern: make_response("..." + $X + "...", ...)
          - pattern: render_template_string($X, ...)
          - pattern: Markup($X)

  - id: caa.python.ssrf.user-url-fetch
    languages: [python]
    severity: WARNING
    message: Outbound request to a non-constant URL inside a request handler.
    metadata: {cwe: "CWE-918", group: A}
    patterns:
      - pattern-inside: |
          @$APP.route(...)
          def $H(...):
            ...
      - pattern-either:
          - pattern: requests.$M($U, ...)
          - pattern: urllib.request.urlopen($U, ...)
      - pattern-not: requests.$M("...", ...)
      - pattern-not: urllib.request.urlopen("...", ...)

  - id: caa.python.secrets.hardcoded-credential
    languages: [python]
    severity: WARNING
    message: Credential-like value hard-coded in source.
    metadata: {cwe: "CWE-798", group: D}
    pattern-either:
      - pattern-regex: (?i)\b(?:password|passwd|secret_key|api_key|apikey|auth_token|access_token)\s*=\s*['"][^'"\s]{8,}['"]
      - pattern-regex: (?i)app\.config\[['"](?:SECRET_KEY|PASSWORD)['"]\]\s*=\s*['"][^'"]{6,}['"]

  - id: caa.python.crypto.weak-hash
    languages: [python]
    severity: WARNING
    message: Weak hash algorithm used (MD5/SHA1).
    metadata: {cwe: "CWE-327", group: D}
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)

  - id: caa.python.config.flask-debug
    languages: [python]
    severity: WARNING
    message: Flask debug mode enabled (interactive debugger exposes code execution).
    metadata: {cwe: "CWE-489", group: D}
    pattern: $APP.run(..., debug=True, ...)

  - id: caa.python.config.cors-wildcard
    languages: [python]
    severity: INFO
    message: CORS allows any origin.
    metadata: {cwe: "CWE-942", group: D}
    pattern: CORS($APP, ..., origins="*", ...)
