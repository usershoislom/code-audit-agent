[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-audit-agent"
version = "0.1.0"
description = "Local AI agent for defensive security code review with an evidence ladder (L0-L5)"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "pyyaml>=6.0",
  "openai==3.26.0",
  "semgrep==1.179.0",
  "bandit==1.9.4",
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
stand = ["flask==3.1.3", "requests>=2.32", "markupsafe>=2.1"]
dev = ["pytest==9.1.1"]

[project.scripts]
caa = "caa.cli:main"

[tool.setuptools.packages.find]
include = ["caa*"]

[tool.setuptools.package-data]
caa = ["core/kb/cards/*.yaml", "sandbox/harness.py"]
