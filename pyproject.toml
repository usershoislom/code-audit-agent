[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-audit-agent"
version = "0.1.0"
description = "Local AI agent for defensive security code review with an evidence ladder (L0-L5)"
requires-python = ">=3.11"
# External analyzers (opengrep/semgrep, bandit, gosec, govulncheck, osv-scanner, gitleaks) are NOT
# Python dependencies of the agent: scripts/install_tools.sh puts them in an isolated prefix.
dependencies = [
  "pydantic==2.13.5",
  "pyyaml>=6.0",
  "openai==3.26.0",
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
stand = ["flask==3.1.3", "requests>=2.32", "markupsafe>=2.1", "fastapi>=0.115", "uvicorn>=0.30", "django>=5.0"]
dev = ["pytest==9.1.1"]
browser = ["playwright==1.56.0"]

[project.scripts]
caa = "caa.cli:main"

[tool.setuptools.packages.find]
include = ["caa*"]

[tool.setuptools.package-data]
caa = ["core/kb/cards/*.yaml", "sandbox/harness.py"]
